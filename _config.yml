# Basic Site Settings
locale                   : "en-GB"
site_theme               : "contrast"
title                    : "Fabian Polnitzky"
name                     : "Fabian Polnitzky"
description              : "Personal academic webpage of Fabian Polnitzky"
url                      : "https://fabianpolnitzky.github.io" # The base hostname & protocol for your site e.g. "https://[your GitHub username].github.io"
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "fabianpolnitzky/fabianpolnitzky.github.io"

# Site Author
author:
  # Biographic information
  avatar           : "profile.png"
  name             : "Fabian Polnitzky"
  pronouns         : "he / him"  
  bio              : "PhD student in Astrophysics working on the spatial distribution of matter in the Milky Way and timescales of protoplanetary discs"
  employer         : "RWTH Aachen University"
  email            : "fabian.polnitzky@rwth-aachen.de" 

  # Academic websites
  ads              : https://ui.adsabs.harvard.edu/search/fq=%7B!type%3Daqp%20v%3D%24fq_database%7D&fq_database=(database%3Aastronomy%20OR%20database%3Aphysics)&p_=0&q=%20%20first_author%3A%22polnitzky%22%20year%3A(2025-)&sort=date%20desc%2C%20bibcode%20desc
  arxiv            : # https://arxiv.org/search/astro-ph?query=Polnitzky%2C+F&searchtype=author&abstracts=show&order=-announced_date_first&size=50
  googlescholar    : # "https://scholar.google.com/citations?user=PS_CX0AAAAAJ"
  orcid            : "https://orcid.org/0009-0006-3890-8980"
  researchgate     : # URL
  zotero           : # URL


  # Repositories and software development
  github           : "fabianpolnitzky"
  kaggle           : # Username  
  stackoverflow    : # User number or user number and name (i.e., use "1" or "1/jeff-atwood")    

  # Social media
  bluesky          : fabian-polnitzky.bsky.social
  linkedin         : # Username

# Publication Category - The following the list of publication categories and their headings
publication_category:
  discs:
    title: "Work on protoplanetary discs"
  mw:
    title: "Work on the structure of the Milky Way"

# Talks Category - The following the list of Talks categories and their headings
talk_category:
  talks:
    title: "Talks"
  posters:
    title: "Posters"

# Site Settings
future                   : true
talkmap_link             : true      #change to true to add link to talkmap on talks page


# Social Sharing
og_image                 : "profile.png" # Social media default site image
og_description           : Personal academic webpage of Fabian Polnitzky # Social media default site image description
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : Person # Person or Organization (defaults to Person)
  name                   : Fabian Polnitzky  # If the user or organization name differs from the site's name
  links:   # An array of links to social media profiles
    - "https://orcid.org/0009-0006-3890-8980"
    - "https://github.com/fabianpolnitzky"
    - "https://bsky.app/profile/fabian-polnitzky.bsky.social"
    # - linkedin


# Reading Files
include:
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/theme.js
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - CLAUDE.md
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - pyproject.toml
  - Rakefile
  - README
  - talkmap.py
  - tmp
  - uv.lock
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# These settings control the types of collections used by the template
collections:
  teaching:
    output: false
    permalink: /:collection/:path/
  publications:
    output: false
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/


# These settings control how pages and collections are included in the site
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      author_profile: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      author_profile: true
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
  # Keep standalone assets out of sitemap.xml. Search engines should land people
  # on real pages of the site, not on a bare PDF or the raw map iframe, neither
  # of which links back to the rest of the site. The pages that present them
  # (/talks/, /cv/, /talkmap.html) stay in the sitemap.
  - scope:
      path: "files"
    values:
      sitemap: false
  - scope:
      path: "talkmap"
    values:
      sitemap: false


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:title/
paginate: 8 # amount of posts to show
paginate_path: /blog/page:num/ # must stay under the /blog/ permalink of index.html
timezone: Europe/Berlin # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# HTML Compression
# - https://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
