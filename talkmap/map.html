<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Places I have presented my research</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<!--
	  Hand-edited after generation by ../talkmap.py (getorg).
	  getorg's template loads Leaflet 1.0.0-beta.2 from cdnjs and requests the
	  Esri tiles over plain http. On an https site those tile requests are mixed
	  content and get blocked, which leaves the map blank. Leaflet and
	  Leaflet.markercluster are therefore vendored in leaflet_dist/ and the tile
	  URL is https. RE-APPLY THESE EDITS whenever talkmap.py is run again.
	-->
	<link rel="stylesheet" href="leaflet_dist/leaflet.css" />
	<link rel="stylesheet" href="leaflet_dist/screen.css" />
	<link rel="stylesheet" href="leaflet_dist/MarkerCluster.css" />
	<link rel="stylesheet" href="leaflet_dist/MarkerCluster.Default.css" />

	<script src="leaflet_dist/leaflet.js"></script>
	<script src="leaflet_dist/leaflet.markercluster.js"></script>
	<script src="org-locations.js"></script>
</head>
<body>

	<div id="map"></div>
	<script type="text/javascript">
		var tiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
			maxZoom: 18,
			attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012'
		}),
			latlng = L.latLng(30, 10);
		var map = L.map('map', {center: latlng, zoom: 0.7, layers: [tiles]});
		var markers = L.markerClusterGroup({
			showCoverageOnHover: false,
			maxClusterRadius: 80
		});
		for (var i = 0; i < addressPoints.length; i++) {
			var a = addressPoints[i];
			var title = a[0];
			var marker = L.marker(new L.LatLng(a[1], a[2]), { title: title });
			marker.bindPopup(title);
			markers.addLayer(marker);
		}
		map.addLayer(markers);
		map.zoomIn();
	</script>
</body>
</html>
